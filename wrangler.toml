name = "qqbot"
account_id = "75609a64ee5df8b79e19e72dc71febd6"
main = "build/worker/shim.mjs"
compatibility_date = "2024-09-23"

[build]
command = "bash build.sh"

[[d1_databases]]
binding = "DB"
database_name = "qbot"
database_id = "c218fba1-3074-4611-8027-be905b19658c"
migrations_dir = "migrations"

# KV 用于 QQ AccessToken 缓存（必需）
[[kv_namespaces]]
binding = "KV"
id = "a4fad0f88b3f433199a6c02185705961"

[vars]
# QQ_APP_ID、QQ_APP_SECRET、ADMIN_TOKEN 使用 wrangler secret 配置
QQ_API_BASE = "https://api.sgroup.qq.com"
SKIP_SIGNATURE = "false"

# 先创建队列: npx wrangler queues create qqbot-events
[[queues.producers]]
binding = "EVENTS"
queue = "qqbot-events"

[[queues.consumers]]
queue = "qqbot-events"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
retry_delay = 15
max_concurrency = 2