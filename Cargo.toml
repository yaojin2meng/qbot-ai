[package]
name = "qbot-ai"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.4"
worker-macros = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
hex = "0.4"

# QQ 开放平台回调签名校验用的 Ed25519
ed25519-dalek = "2"
base64 = "0.22"

# 随机出题 & 随机种子
rand = "0.8"

# SVG -> PNG 纯 Rust 光栅化
resvg = "0.44"
tiny-skia = "0.11"

# 时间戳
js-sys = "0.3"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"