[package]
name = "qbot-ai"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "=0.8.7", features = ["d1", "queue"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

# QQ 开放平台回调签名校验用的 Ed25519
ed25519-dalek = "2"
base64 = "0.22"

# 随机出题 & 随机种子
rand = "0.8"
# 解决 wasm32-unknown-unknown 下缺少随机数熵的编译错误
getrandom = { version = "0.2", features = ["js"] }

# SVG -> PNG 纯 Rust 光栅化
resvg = { version = "0.44", default-features = false, features = ["text", "raster-images"] }

# 有限并发、令牌摘要与常数时间比较
futures-util = "0.3"
sha2 = "0.10"
subtle = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"